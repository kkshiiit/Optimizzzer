# Temporary: moves release tags to the rewritten commits (same code). Removed right after use.
name: retag
on:
  workflow_dispatch:
    inputs:
      moves:
        description: "tag=sha pairs separated by spaces"
        required: true
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          MOVES: ${{ inputs.moves }}
        run: |
          for m in $MOVES; do
            tag="${m%%=*}"; sha="${m#*=}"
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="$sha" -F force=true --jq '.ref + " -> " + .object.sha'
          done
